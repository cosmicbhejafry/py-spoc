[build-system]
requires      = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pyspoc*"]

[project]
name = "pyspoc"
version = "2.0.0"
authors = [
    { name ="Garry Cotton", email="garry.s.cotton@gmail.com"},
    { name ="cosmicbhejafry"},    
]

description = "Library for generating large volumes of statistical summaries on static datasets."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"

dependencies = [
  "typeguard",
  "h5py",
  "Cython",
  "Ripser",
  "scikit-learn",
  "scikit-learn-extra",
  "scipy",
  "numpy<2.0.0",
  "pandas",
  "pyarrow",
  "fastparquet",
  "statsmodels",
  "pyyaml",
  "tqdm",
  "hyppo",
  "jpype1",
  "dill",
  "cdt==0.5.23",
  "oct2py",
  "seaborn",
  "future",
  "mne_connectivity",
  "jaxtyping"
]

classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-benchmark",
  "mypy",
  "ruff",
  "watchfiles"
]

doc = [
  "numpydoc",
  "sphinx"
]

notebooks = [
  "jupyter",
  "ipykernel",
  "matplotlib"
]

extended = [
  "torch"
]

all = [
  "pytest",
  "pytest-benchmark",
  "mypy",
  "numpydoc",
  "sphinx",
  "jupyter",
  "ipykernel",
  "matplotlib",
  "ruff",
  "torch"
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests","benchmarks"]
addopts = "-ra"

[tool.pytest-benchmark]
min_rounds = 5
sort = "mean"

[tool.ruff]
line-length = 100
target-version = "py310"
lint.select = ["E", "F", "W"]
lint.ignore = ["W293", "E722", "F722"]

# optionally:   "nbstripout"

[project.urls]
Repository = "https://github.com/cosmicbhejafry/py-spoc/"
