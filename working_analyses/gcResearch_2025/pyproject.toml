[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gc-results"
version = "0.0.1"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["results*"]
exclude = [
    "data*",
    "outputs*",
    "figures*",
    "notebooks*",
    "*.yaml",
    "*.yml"]