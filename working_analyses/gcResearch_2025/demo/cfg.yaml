Statistics:
# Pearson and Spearman correlation statistics
  pyspoc.statistics.cov:
    # Covariance
    Covariance:
      schemes:
        cov:
          estimator: EmpiricalCovariance

    # Spearman's correlation coefficient
    SpearmanR:
      #dependencies:
      #  - java
      schemes:
        sq:
          squared: True
        standard:
          squared: False

    # Kendall Tau correlation coefficient
    KendallTau:
      schemes:
        sq:
          squared: True
        standard:
          squared: False

  pyspoc.statistics.causal:
    # Information geometric conditional independence test
    InformationGeometricConditionalIndependence:
      schemes:
        standard:

  pyspoc.statistics.distance:
    # Pairwise distance
    PairwiseDistance:
      schemes:
        standard:
          metric: euclidean
        manhattan:
          metric: manhattan
        cosine:
          metric: cosine

  pyspoc.statistics.distance.hsic:
    # HISC distance
    HilbertSchmidtIndependenceCriterion:
      schemes:
        standard:

  pyspoc.statistics.model_fits:
    LinearModelError:
      schemes:
        linear:
          model: LinearRegression

  pyspoc.statistics.clustering.kmeans:
    KClusteringSimilarity:
      schemes:
        three-rbf:
          k: 3
          kernel: rbf
        five-rbf:
          k: 5
          kernel: rbf
        seven-laplacian:
          k: 7
          kernel: laplacian
        nine-inverse-distance:
          k: 9
          kernel: inverse_distance
        eleven-mahalanobis-rbf:
          k: 11
          kernel: mahalanobis_rbf

Reducers:
  pyspoc.reducers.basic:
    SingularValues:
      schemes:
        three:
          num_values: 3

    Determinant:
      schemes:
        scaled:
          scaled: True

        non-scaled:
          scaled: False

  pyspoc.rstatistics.ranks:
    EffectiveRank:
      schemes:
        standard:

    StableRank:
      schemes:
        standard:

  pyspoc.rstatistics.norms:
    SchattenNorm:
      schemes:
        one:
          p: 1
        two:
          p: 2
        three:
          p: 3

ReducedStatistics:
  pyspoc.rstatistics.fractal:
    RenyiEntropy:
      schemes:
        zero:
          q: 0
        one:
          q: 1

  pyspoc.rstatistics.dimreduce.pca:
    PCAVarianceExplainedRatio:
      schemes:
        three:
          components: 3
  
  pyspoc.rstatistics.dimreduce.orthopcae:
    OrthogonalPCAEVarianceExplainedRatio:
      schemes:
        three:
          components: 3